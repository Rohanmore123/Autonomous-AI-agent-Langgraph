# alembic.ini
# =============
# Alembic database migration configuration.
#
# USAGE:
#   # Create a new migration (auto-detect model changes)
#   alembic revision --autogenerate -m "add_user_preferences_column"
#
#   # Apply all pending migrations
#   alembic upgrade head
#
#   # Roll back the last migration
#   alembic downgrade -1
#
#   # Show current migration state
#   alembic current
#
#   # Show migration history
#   alembic history --verbose
#
#   # Show pending migrations
#   alembic history --indicate-current
#
# NOTE:
#   The database URL is read from env var DATABASE_URL in alembic/env.py,
#   NOT from the [alembic] sqlalchemy.url setting below.
#   The url= line is kept as a fallback for alembic CLI direct usage.

[alembic]
# Path to migration scripts
script_location = alembic

# Template for new migration file names
# %(rev)s  = revision ID (short hash)
# %(slug)s = slugified migration message
# %(year)d %(month).2d %(day).2d = date
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Prepend sys.path with this (so app.* imports work in migration scripts)
prepend_sys_path = .

# Timezone for migration file timestamps
timezone = UTC

# Truncate long slugs in filenames
truncate_slug_length = 40

# Revision number format
revision_environment = false

# Enable "offline" mode (generate SQL without DB connection)
sourceless = false

# Version locations (support multiple version directories if needed)
# version_locations = %(here)s/alembic/versions

# SQLAlchemy connection string — overridden by DATABASE_URL env var in env.py
sqlalchemy.url = postgresql+asyncpg://llm_user:password@localhost:5432/llm_platform

# ---------------------------------------------------------------------------
# Logging configuration (controls Alembic's own log output)
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S