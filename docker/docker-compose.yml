# docker/docker-compose.yml
# ==========================
# Full production stack for LLM Agentic Platform.
#
# SERVICES:
#   llm-api         — FastAPI application (4 Gunicorn + Uvicorn workers)
#   celery-worker   — Background task worker (document ingestion, batch LLM)
#   celery-beat     — Scheduled task scheduler (daily digests, cleanup)
#   flower          — Celery monitoring UI
#   postgres        — Primary database (PostgreSQL 16)
#   redis           — Cache + broker + sessions (Redis 7)
#   weaviate        — Vector database (Weaviate 1.24)
#   nginx           — Reverse proxy + TLS termination
#   prometheus      — Metrics collection
#   grafana         — Metrics dashboards
#   alertmanager    — Alert routing (Slack, PagerDuty)
#   jaeger          — Distributed tracing UI
#   node-exporter   — Host metrics for Prometheus
#   redis-exporter  — Redis metrics for Prometheus
#   postgres-exporter — PostgreSQL metrics for Prometheus
#
# SCALING FOR 10K USERS:
#   API: 3–5 replicas behind nginx (horizontal scaling)
#   Celery: 2–4 worker replicas (CPU-bound document ingestion)
#   Redis: Redis Cluster for high availability
#   Postgres: Read replicas for analytics queries
#   Weaviate: Multi-node cluster with replication factor=2

services:

  # ── LLM API ──────────────────────────────────────────────────────────────
  llm-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    image: llm-platform-api:latest
    container_name: llm-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://llm_user:${POSTGRES_PASSWORD}@postgres:5432/llm_platform
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
      - REDIS_CELERY_URL=redis://redis:6379/2
      - REDIS_RATE_LIMIT_URL=redis://redis:6379/3
      - WEAVIATE_URL=http://weaviate:8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    env_file:
      - ../.env
    volumes:
      - app_logs:/var/log/llm-platform
      - model_cache:/tmp/sentence_transformers   # Embedding model cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "scripts/health_check.py", "--host", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - internal
      - monitoring
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 1G

  # ── Celery Worker ─────────────────────────────────────────────────────────
  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    image: llm-platform-api:latest
    container_name: celery-worker
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      --concurrency=4
      --queues=default,ingestion
      --max-tasks-per-child=100
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg2://llm_user:${POSTGRES_PASSWORD}@postgres:5432/llm_platform
      - REDIS_CELERY_URL=redis://redis:6379/2
    env_file:
      - ../.env
    volumes:
      - model_cache:/tmp/sentence_transformers
    depends_on:
      - redis
      - postgres
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G

  # ── Celery Beat (scheduler) ───────────────────────────────────────────────
  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    image: llm-platform-api:latest
    container_name: celery-beat
    command: >
      celery -A app.workers.celery_app beat
      --loglevel=info
      --scheduler celery.beat.PersistentScheduler
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - REDIS_CELERY_URL=redis://redis:6379/2
    env_file:
      - ../.env
    depends_on:
      - redis
    networks:
      - internal

  # ── Celery Flower (monitoring) ────────────────────────────────────────────
  flower:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    image: llm-platform-api:latest
    container_name: flower
    command: >
      celery -A app.workers.celery_app flower
      --port=5555
      --basic_auth=admin:${FLOWER_PASSWORD:-flower_secret}
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      - REDIS_CELERY_URL=redis://redis:6379/2
    env_file:
      - ../.env
    depends_on:
      - redis
    networks:
      - internal
      - monitoring

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=llm_platform
      - POSTGRES_USER=llm_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=en_US.UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm_user -d llm_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c max_connections=300
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=16MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c log_min_duration_statement=1000
    networks:
      - internal

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --appendonly yes
      --tcp-keepalive 60
      --timeout 300
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - internal

  # ── Weaviate ──────────────────────────────────────────────────────────────
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.24.4
    container_name: weaviate
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50051:50051"   # gRPC
      - "2112:2112"     # Prometheus metrics
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=false
      - AUTHENTICATION_APIKEY_ENABLED=true
      - AUTHENTICATION_APIKEY_ALLOWED_KEYS=${WEAVIATE_API_KEY}
      - AUTHENTICATION_APIKEY_USERS=admin
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - ENABLE_MODULES=text2vec-transformers
      - PROMETHEUS_MONITORING_ENABLED=true
      - PROMETHEUS_MONITORING_PORT=2112
      - LOG_LEVEL=info
      - LIMIT_RESOURCES=false
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks:
      - internal
      - monitoring

  # ── Nginx (Reverse Proxy) ─────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - llm-api
    networks:
      - internal

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alert_rules.yml:/etc/prometheus/rules/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    networks:
      - monitoring

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana_dashboard.json:/etc/grafana/provisioning/dashboards/llm_platform.json:ro
    depends_on:
      - prometheus
    networks:
      - monitoring

  # ── Alertmanager ──────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - monitoring

  # ── Jaeger (Distributed Tracing) ─────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory   # Use elasticsearch for production
      - MEMORY_MAX_TRACES=50000
    networks:
      - internal
      - monitoring

  # ── Exporters ─────────────────────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
    networks:
      - monitoring

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      - redis
    networks:
      - internal
      - monitoring

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://llm_user:${POSTGRES_PASSWORD}@postgres:5432/llm_platform?sslmode=disable
    depends_on:
      - postgres
    networks:
      - internal
      - monitoring

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:    { driver: local }
  redis_data:       { driver: local }
  weaviate_data:    { driver: local }
  prometheus_data:  { driver: local }
  grafana_data:     { driver: local }
  app_logs:         { driver: local }
  nginx_logs:       { driver: local }
  model_cache:      { driver: local }

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  internal:    { driver: bridge }
  monitoring:  { driver: bridge }