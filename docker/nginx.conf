# docker/nginx.conf
# ==================
# Nginx reverse proxy for LLM Agentic Platform.
#
# RESPONSIBILITIES:
#   1. TLS/SSL termination (HTTPS → HTTP to API)
#   2. Load balancing across API server instances
#   3. Static file serving (if needed)
#   4. Request buffering and upstream timeouts
#   5. Security headers (HSTS, CSP, X-Frame-Options)
#   6. Gzip compression
#   7. SSE (Server-Sent Events) pass-through configuration
#   8. Rate limiting at the proxy level (first line of defence)
#   9. Connection limits to prevent DDoS
#
# FOR 10K CONCURRENT USERS:
#   worker_processes auto;          → one per CPU core
#   worker_connections 4096;        → 4096 simultaneous connections per worker
#   keepalive_timeout 65;           → reuse connections (avoid TCP overhead)
#   upstream keepalive 32;          → keep 32 persistent connections to each API backend
#
# SSL CERTIFICATES:
#   In production: use Let's Encrypt via certbot
#   In development: generate self-signed certs with scripts/gen_ssl.sh
#   Certificate paths: /etc/nginx/ssl/cert.pem, /etc/nginx/ssl/key.pem

# ---------------------------------------------------------------------------
# Global settings
# ---------------------------------------------------------------------------

user nginx;
worker_processes auto;                    # One per CPU core
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;              # Max connections per worker
    multi_accept on;                      # Accept multiple connections at once
    use epoll;                            # Linux high-performance I/O
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---------------------------------------------------------------------------
    # Logging format — structured JSON for log aggregators
    # ---------------------------------------------------------------------------

    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"x_forwarded_for":"$http_x_forwarded_for",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_time":"$upstream_response_time",'
            '"upstream_addr":"$upstream_addr",'
            '"http_referrer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"request_id":"$http_x_request_id"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ---------------------------------------------------------------------------
    # Performance
    # ---------------------------------------------------------------------------

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;               # Hide nginx version from attackers
    client_max_body_size 55M;            # Allow 50MB+ file uploads (matches API limit)
    client_body_timeout 60s;
    client_header_timeout 30s;

    # ---------------------------------------------------------------------------
    # Gzip compression
    # ---------------------------------------------------------------------------

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        application/x-font-ttf
        font/opentype
        image/svg+xml;

    # ---------------------------------------------------------------------------
    # Rate limiting zones (second line of defence after Redis sliding window)
    # Uses nginx's leaky bucket algorithm
    # ---------------------------------------------------------------------------

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;   # Stricter for login
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ---------------------------------------------------------------------------
    # Upstream (API servers — add more for horizontal scaling)
    # ---------------------------------------------------------------------------

    upstream llm_api {
        least_conn;                       # Route to server with fewest active connections
        server llm-api:8000 max_fails=3 fail_timeout=30s;
        # Add more instances for horizontal scaling:
        # server llm-api-2:8000 max_fails=3 fail_timeout=30s;
        # server llm-api-3:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;                     # Persistent upstream connections
    }

    # ---------------------------------------------------------------------------
    # HTTP → HTTPS redirect
    # ---------------------------------------------------------------------------

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Let's Encrypt challenge path
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------------------------------------------------------------------------
    # HTTPS server
    # ---------------------------------------------------------------------------

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name llmplatform.local localhost;    # Replace with real domain

        # ── SSL ────────────────────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP stapling (requires ssl_trusted_certificate in production)
        # ssl_stapling on;
        # ssl_stapling_verify on;

        # ── Security headers ───────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

        # Request ID passthrough (generated by Nginx, echoed by API)
        add_header X-Request-ID $request_id always;

        # ── Connection limits ──────────────────────────────────────────────────
        limit_conn conn_limit 20;         # Max 20 concurrent connections per IP

        # ── Proxy settings ─────────────────────────────────────────────────────
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_http_version 1.1;
        proxy_set_header Connection "";   # Enable keepalive to upstream
        proxy_read_timeout    300s;       # Long timeout for LLM streaming
        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;
        proxy_buffering off;              # Required for SSE streaming

        # ── Health check (no rate limit, no auth) ──────────────────────────────
        location = /health {
            proxy_pass http://llm_api/health;
            access_log off;              # Don't log health checks (noisy)
        }

        # ── Prometheus metrics (internal only — block external access) ─────────
        location = /metrics {
            # In production, restrict to monitoring network or VPN
            allow 172.16.0.0/12;         # Docker internal networks
            allow 10.0.0.0/8;
            deny all;
            proxy_pass http://llm_api/metrics;
        }

        # ── Auth endpoints (stricter rate limit) ───────────────────────────────
        location /api/v1/auth/login {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://llm_api;
        }

        location /api/v1/auth/register {
            limit_req zone=auth_limit burst=3 nodelay;
            limit_req_status 429;
            proxy_pass http://llm_api;
        }

        # ── SSE streaming endpoint (special config: no buffering, no timeout) ──
        location /api/v1/chat/stream {
            proxy_pass http://llm_api;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;    # 1 hour for long streams
            proxy_set_header Cache-Control no-cache;
            # SSE requires chunked encoding
            chunked_transfer_encoding on;
        }

        # ── File upload endpoint (large body allowed) ──────────────────────────
        location /api/v1/documents/upload {
            client_max_body_size 55M;
            client_body_buffer_size 128k;
            proxy_request_buffering off; # Stream upload to backend
            proxy_pass http://llm_api;
        }

        # ── All other API endpoints ────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://llm_api;
        }

        # ── OpenAPI docs (development only — disable in production) ───────────
        location ~ ^/(docs|redoc|openapi.json) {
            # Uncomment the next two lines to disable in production:
            # return 404;
            proxy_pass http://llm_api;
        }

        # ── Block common attack paths ──────────────────────────────────────────
        location ~ /\. {
            deny all;
            return 404;
        }

        location ~ ~$ {
            deny all;
            return 404;
        }

        # ── Default fallback ───────────────────────────────────────────────────
        location / {
            proxy_pass http://llm_api;
        }

        # ── Error pages ────────────────────────────────────────────────────────
        error_page 429 = @rate_limited;
        location @rate_limited {
            add_header Content-Type "application/json" always;
            return 429 '{"success":false,"errors":[{"code":"RATE_LIMIT_EXCEEDED","message":"Too many requests. Please slow down."}]}';
        }

        error_page 502 503 504 = @upstream_error;
        location @upstream_error {
            add_header Content-Type "application/json" always;
            return 503 '{"success":false,"errors":[{"code":"SERVICE_UNAVAILABLE","message":"The service is temporarily unavailable. Please try again shortly."}]}';
        }
    }
}