[pytest]
# pytest.ini
# ===========
# Pytest configuration for the LLM Agentic Platform test suite.

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode — auto so every async test function is awaited automatically
# Requires: pytest-asyncio
asyncio_mode = auto

# Default markers (add --run-e2e to enable e2e tests)
addopts =
    --strict-markers
    --tb=short
    -q
    --no-header

# Custom markers — documented here to avoid "Unknown mark" warnings
markers =
    unit: Unit tests (no external services required)
    integration: Integration tests (SQLite DB, mocked external services)
    e2e: End-to-end tests (requires full Docker stack running)
    slow: Tests that take > 5 seconds
    llm: Tests that involve real LLM API calls (costly, requires API keys)

# Log settings during tests
log_cli = true
log_cli_level = WARNING
log_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_date_format = %H:%M:%S

# Coverage settings (when running with --cov)
# Run: pytest --cov=app --cov-report=html --cov-report=term-missing
# [coverage:run] and [coverage:report] below are used by coverage.py